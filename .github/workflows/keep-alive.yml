name: Keep Render Alive

on:
  schedule:
    # 每 14 分钟 ping 一次 (注意：*/14 实际是每小时的 0, 14, 28, 42, 56 分)
    - cron: '*/14 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render health endpoint
        run: |
          URL="https://telegram-che-bot.onrender.com/"
          # 将超时时间提高到 120 秒，给 Render 足够的冷启动时间
          if curl -sf --max-time 120 "$URL" > /dev/null; then
            echo "✅ Ping OK"
          else
            echo "⚠️ Ping failed (service may be cold-starting or down)"
          fi
